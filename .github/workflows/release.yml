name: Release
# Pushing a v* tag builds, verifies and publishes the release. A manual run
# builds the same packages as a workflow artifact without publishing.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Install official Inno Setup compiler
        shell: pwsh
        run: |
          $taskSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $taskSetup
          $taskSignature = Get-AuthenticodeSignature -LiteralPath $taskSetup
          if ($taskSignature.Status -ne 'Valid' -or $taskSignature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') { throw 'Unexpected Inno Setup publisher signature' }
          $taskCompiler = Join-Path $env:RUNNER_TEMP 'GamePause-InnoSetup'
          $taskInstall = Start-Process -FilePath $taskSetup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', ('/DIR="' + $taskCompiler + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($taskInstall.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
      - shell: pwsh
        run: ./scripts/build_release.ps1 -Iscc (Join-Path $env:RUNNER_TEMP 'GamePause-InnoSetup\ISCC.exe')
      - shell: pwsh
        run: ./scripts/verify_release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GamePause-windows-x64
          path: |
            dist/*.zip
            dist/*-Setup.exe
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.json
      - name: Publish the release with its changelog section as notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskVersion = (Get-Content -LiteralPath 'dist\BUILD-INFO.json' -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$taskVersion") { throw "Tag $env:GITHUB_REF_NAME does not match package version $taskVersion" }
          $taskNotes = [Collections.Generic.List[string]]::new()
          $taskInSection = $false
          foreach ($taskLine in Get-Content -LiteralPath 'CHANGELOG.md') {
            if ($taskLine -match '^## ') {
              if ($taskInSection) { break }
              $taskInSection = $taskLine -match ('^## ' + [regex]::Escape($taskVersion) + '(\s|$)')
              continue
            }
            if ($taskInSection) { $taskNotes.Add($taskLine) }
          }
          if (-not ($taskNotes | Where-Object { $_.Trim() })) { throw "CHANGELOG.md has no entry for $taskVersion" }
          $taskNotes.Add('')
          $taskNotes.Add('Download the Setup.exe for a per-user installation or the windows-x64.zip for portable use. Quit a running GamePause from the tray before upgrading. The binaries are unsigned; compare downloads against SHA256SUMS.txt.')
          $taskNotesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $taskNotes | Set-Content -LiteralPath $taskNotesFile -Encoding utf8
          gh release create $env:GITHUB_REF_NAME --title "GamePause for Local AI $taskVersion" --notes-file $taskNotesFile --verify-tag "dist/GamePause-$taskVersion-Setup.exe" "dist/GamePause-$taskVersion-windows-x64.zip" dist/SHA256SUMS.txt dist/BUILD-INFO.json
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
