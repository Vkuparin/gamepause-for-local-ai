[package]
name = "gamepause"
version = "2.2.1"
edition = "2024"
license = "MIT"
description = "A native Windows tray app that pauses local AI for games and restores it afterward, for LM Studio, Ollama and other local AI servers."
repository = "https://github.com/Vkuparin/gamepause-for-local-ai"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
roxmltree = "0.21"
ureq = { version = "2.12", default-features = false, features = ["json"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Pipes", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Controls_Dialogs", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi"] }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui_extras = { version = "0.33.3", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[[bin]]
name = "GamePause"
path = "src/main.rs"

[[bin]]
name = "GamePauseCLI"
path = "src/cli.rs"

[build-dependencies]
winresource = "0.1.31"

[features]
resilience-test = []

[[example]]
name = "resilience_probe"
required-features = ["resilience-test"]

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
